<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feuille de route — Connexion</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-connexion">
  <main class="carte-connexion">
    <h1>Feuille de route</h1>
    <p class="sous-titre">Votre planning du jour, généré depuis votre Google Agenda.</p>

    <a class="bouton-google" href="/auth/google/start">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.36 0-4.35-1.59-5.06-3.72H.94v2.33A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.94 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3-2.33Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3 2.33C4.65 5.17 6.64 3.58 9 3.58Z"/>
      </svg>
      Se connecter avec Google
    </a>

    <p class="mention">
      Accès en lecture seule à votre agenda uniquement (aucune modification possible).
      Rien n'est partagé entre chauffeurs : chacun ne voit que sa propre feuille de route.
    </p>
  </main>
  <script src="/js/connexion.js"></script>
</body>
</html>
