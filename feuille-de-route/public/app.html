<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feuille de route</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-app">
  <header class="entete">
    <div class="entete-identite">
      <h1>Feuille de route</h1>
      <span id="nom-chauffeur" class="nom-chauffeur"></span>
    </div>
    <div class="entete-actions no-print">
      <select id="choix-calendrier" aria-label="Calendrier Google à utiliser" hidden></select>
      <button id="bouton-imprimer" type="button" class="bouton-secondaire">Imprimer</button>
      <a href="/auth/logout" class="bouton-secondaire">Déconnexion</a>
    </div>
  </header>

  <nav class="barre-date no-print">
    <button id="jour-precedent" type="button" aria-label="Jour précédent">◀</button>
    <input id="date-selectionnee" type="date" />
    <button id="jour-suivant" type="button" aria-label="Jour suivant">▶</button>
    <button id="bouton-aujourdhui" type="button" class="bouton-secondaire">Aujourd'hui</button>
  </nav>

  <p id="date-affichee" class="date-affichee"></p>

  <main id="zone-resultat">
    <p id="chargement" class="etat-info">Chargement de votre agenda…</p>
    <p id="erreur" class="etat-erreur" hidden></p>
    <p id="vide" class="etat-info" hidden>Aucune course prévue ce jour-là.</p>
    <div id="liste-courses" class="liste-courses"></div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
